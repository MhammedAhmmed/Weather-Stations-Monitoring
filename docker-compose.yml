version: '3.8'

services:
  java-app:
    build: ./java-app
    volumes:
      - parquet_data:/app/data/parquet  # Matches Java code
    environment:
      - OUTPUT_DIR=/app/data/parquet  # Optional (if your Java code reads env vars)

  python-converter:
    build: ./python-converter
    volumes:
      - parquet_data:/app/data/parquet  # Shared with Java
      - json_data:/data/json        # For Filebeat
    environment:
      - PARQUET_DIR=/app/data/parquet
      - OUTPUT_DIR=/data/json

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.7.1
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - json_data:/data/json  # Matches Python output
    depends_on:
      - logstash

  logstash:
    image: docker.elastic.co/logstash/logstash:8.7.1
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.7.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.7.1
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  parquet_data:  # Shared between Java and Python
  json_data:     # Shared between Python and Filebeat
